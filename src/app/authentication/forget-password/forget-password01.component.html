<div class="page responsive-log login-bg">
    <!-- Loading Overlay -->
    <div class="loading-overlay" *ngIf="loading">
      <div class="spinner-border text-primary dual-spinner" role="status"></div>
      <div class="loading-text">Veuillez patienter...</div>
    </div>
  
    <div class="page-single">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col mx-auto">
            <div class="row justify-content-center">
              <div class="col-md-8 col-lg-6 col-xl-4 col-xxl-4">
                <div class="card custom-card my-4">
                  <div class="p-4 pt-6 text-center">
                    <img
                      src="./assets/images/Leoni_AG_Logo.svg.png"
                      class="leoni"
                      alt="Logo"
                      width="150"
                      height="auto"
                      loading="lazy"
                    />
                    <p class="text-muted">Réinitialisation du mot de passe</p>
                  </div>
  
                  <!-- Step 1: Enter Email -->
                  <form *ngIf="step === 1" [formGroup]="emailForm" (ngSubmit)="sendResetCode()" class="card-body pt-0 pb-3">
                    <div class="form-group">
                      <label class="form-label">Email</label>
                      <div class="input-group mb-3">
                        <span class="input-group-text"><i class="fe fe-mail"></i></span>
                        <input
                          formControlName="email"
                          type="email"
                          class="form-control"
                          placeholder="Votre adresse email"
                        />
                      </div>
                    </div>
                    <div class="submit d-grid">
                      <button class="btn btn-primary" type="submit" [disabled]="emailForm.invalid || loading">
                        Envoyer le code
                      </button>
                    </div>
                  </form>
  
                  <!-- Step 2: Enter Code -->
                  <form *ngIf="step === 2" [formGroup]="codeForm" (ngSubmit)="verifyCode()" class="card-body pt-0 pb-3">
                    <div class="form-group">
                      <label class="form-label">Code reçu par email</label>
                      <div class="input-group mb-3">
                        <span class="input-group-text"><i class="fe fe-check-circle"></i></span>
                        <input
                          formControlName="code"
                          type="text"
                          class="form-control"
                          placeholder="Code de vérification"
                        />
                      </div>
                    </div>
                    <div class="submit d-grid">
                      <button class="btn btn-primary" type="submit" [disabled]="codeForm.invalid || loading">
                        Vérifier le code
                      </button>
  
                      <button
                        type="button"
                        class="btn btn-link mt-2"
                        (click)="resendCode()"
                        [disabled]="!canResend || loading">
                        Renvoyer le code
                        <span *ngIf="!canResend">({{ resendTimer }}s)</span>
                      </button>
                    </div>
                  </form>
  
                  <!-- Step 3: Reset Password -->
                  <form *ngIf="step === 3" [formGroup]="passwordForm" (ngSubmit)="resetPassword()" class="card-body pt-0 pb-3">
                    <div class="form-group">
                      <label class="form-label">Nouveau mot de passe</label>
                      <div class="input-group mb-3">
                        <span class="input-group-text" (click)="createpassword(1)">
                          <i class="fe" [ngClass]="toggleClass"></i>
                        </span>
                        <input
                          formControlName="newPassword"
                          [type]="showPassword ? 'text' : 'password'"
                          class="form-control"
                          placeholder="Nouveau mot de passe"
                        />
                      </div>
                    </div>
  
                    <div class="form-group">
                      <label class="form-label">Confirmer le mot de passe</label>
                      <div class="input-group mb-3">
                        <span class="input-group-text" (click)="createpassword(2)">
                          <i class="fe" [ngClass]="toggleClass1"></i>
                        </span>
                        <input
                          formControlName="confirmPassword"
                          [type]="showPassword1 ? 'text' : 'password'"
                          class="form-control"
                          placeholder="Confirmez le mot de passe"
                        />
                      </div>
                    </div>
  
                    <div class="submit d-grid">
                      <button class="btn btn-primary" type="submit" [disabled]="passwordForm.invalid || loading">
                        Réinitialiser
                      </button>
                    </div>
                  </form>
  
                  <!-- Step 4: Confirmation -->
                  <div *ngIf="step === 4" class="card-body text-center pt-0 pb-4">
                    <i class="fe fe-check-circle text-success fs-50 mb-4"></i>
                    <h5 class="text-success">Mot de passe réinitialisé avec succès</h5>
                    <p class="text-muted">Vous pouvez maintenant vous connecter avec votre nouveau mot de passe.</p>
                    <a class="btn btn-primary mt-3" routerLink="/auth/login">Se connecter</a>
                  </div>
  
                  <div class="card-body border-top-0 pb-6 pt-1">
                    <div class="text-center">
                      <a
                        href="https://www.facebook.com/LEONI.tunisia"
                        target="_blank"
                        class="avatar avatar-rounded me-2 bg-primary-transparent text-primary">
                        <i class="ri-facebook-line fs-17"></i>
                      </a>
                      <a
                        href="https://www.instagram.com/leoni_tunisia/"
                        target="_blank"
                        class="avatar avatar-rounded me-2 bg-primary-transparent text-primary">
                        <i class="ri-instagram-line fs-17"></i>
                      </a>
                      <a
                        href="https://www.leoni-tunisia.com/"
                        target="_blank"
                        class="avatar avatar-rounded bg-primary-transparent text-primary">
                        <span class="fs-17">L</span>
                      </a>
                    </div>
                  </div>
  
                </div> <!-- /card -->
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
